name: cms

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD en .env}
      MONGO_APP_USER: cms_app
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Falta MONGO_APP_PASSWORD en .env}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 500
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet "mongodb://cms_app:$$MONGO_APP_PASSWORD@127.0.0.1:27017/cms?authSource=cms" --eval "db.runCommand({ping:1}).ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      MONGO_URI: mongodb://cms_app:${MONGO_APP_PASSWORD}@mongo:27017/cms?authSource=cms
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      MFA_ENC_KEY: ${MFA_ENC_KEY:?Falta MFA_ENC_KEY en .env}
      CLIENT_ORIGIN: https://localhost:8443
      TRUST_PROXY: "2"
      COOKIE_SECURE: "true"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend
    volumes:
      - uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build: ./client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      BACKEND: http://web:8080
      SERVER_NAME: localhost
      PORT: "8080"
      SSL_PORT: "8443"
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      ALLOWED_METHODS: "GET HEAD POST PUT PATCH DELETE OPTIONS"
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      - backend
      - edge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

networks:
  backend:
    internal: true
  edge: {}

volumes:
  mongo-data:
  uploads:
